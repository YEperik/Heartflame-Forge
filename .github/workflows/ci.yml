name: Heartflame Forge — Linux CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  linux-qt6:
    name: Qt 6 build, tests, and package-consumer check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev libarchive-dev libpng-dev libassimp-dev
      - name: Configure strict GUI build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPS2ASSET_BUILD_GUI=ON -DPS2ASSET_REQUIRE_GUI=ON -DPS2ASSET_BUILD_SAMPLE_PLUGIN=ON
      - name: Build all targets
        run: cmake --build build --parallel 2
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Verify installed CMake package with downstream consumer
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/heartflame-forge-install"
          cmake -S tests/package_consumer -B "$RUNNER_TEMP/heartflame-forge-consumer" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/heartflame-forge-install" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/heartflame-forge-consumer" --parallel 2
          "$RUNNER_TEMP/heartflame-forge-consumer/package_consumer"
      - name: GUI and extension startup smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/HeartflameForge --smoke-test
